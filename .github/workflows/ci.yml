name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: repo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 仓库自检
        run: python3 scripts/check_repo.py --public
      - name: 路由用例检查
        run: python3 scripts/check_routing.py
      - name: 文档命令检查
        run: python3 scripts/check_commands.py
      - name: 隐私扫描
        run: python3 scripts/privacy_scan.py
      - name: ShellCheck（仅 error 级）
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error scripts/*.sh
